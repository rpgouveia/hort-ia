# Training data for the intent classifier (NLU) of the conversational assistant (WBS 9.4).
#
# Status: FIRST DRAFT (out/2026), written to be reviewed by the team and replaced or
# extended with real questions collected from agronomists and garden coordinators.
# Every example carries `origin`, so drafted examples can be told apart from real ones.
#
# Rules (enforced by tests/test_nlu_dataset.py):
# - 30 to 50 examples per intent; no duplicates after normalization (case, accents, punctuation).
# - Mix of styles: standard Portuguese, informal/abbreviated, and typos. Users have low digital
#   literacy, so a dataset with only well-written sentences would not represent them.
# - Crop names vary across all 15 crops and include crops outside the knowledge base, so the
#   classifier learns the intent, not the crop.
# - NEVER copy an example from test_utterances.yaml into this file.
#
# Boundaries between intents (see data/nlu/README.md for the full list):
# - "quando colher X?" is crop_care (harvest time), not planting_time.
# - "o que plantar no lugar do repolho?" (rotation) is companion_planting.
# - Asking for a specific crop is planting_time; asking for suggestions is what_to_plant.
# - Prices of produce (Ceasa) are market_price; prices of inputs (seedlings, fertilizer) are fallback.
# - Topics the knowledge base does not cover are fallback, even if they mention a crop
#   ("receita de bolo de cenoura", "calorias do tomate").

